[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finserv-rca"
version = "0.1.0"
description = "Regulatory Compliance Assistant prototype: versioned RAG, agentic screening, evaluation"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6", "pyyaml>=6", "numpy>=1.26", "requests>=2.31",
  "qdrant-client>=1.12", "rank-bm25>=0.2.2", "wordllama>=0.4",
  "langgraph>=0.2", "pypdf>=4", "beautifulsoup4>=4.12", "typer>=0.12",
]

[project.optional-dependencies]
laptop = ["sentence-transformers>=3.0", "fastembed>=0.4"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "reportlab>=4"]

[project.scripts]
rca = "finserv_rca.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["B008", "ISC004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"scripts/*" = ["E501"]
