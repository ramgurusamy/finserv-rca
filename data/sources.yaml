# Official documents. `make fetch` downloads them on a machine that can reach these sites.
# Regulators may block scripted downloads. If so, save the file by hand under the given
# name in data/official/. Any missing file keeps its digest, and ingestion logs a warning.
official:
  - file: basel-rbc.pdf
    url: https://www.bis.org/committees/bcbs/basel-framework/RBC/standard.pdf
    para_rules:
      - {pattern: '^(\d{2}\.\d{1,3})\s', prefix: "RBC"}
    meta:
      doc_id: basel-rbc
      title: Basel Framework RBC - Risk-based capital requirements
      framework: BASEL_III
      jurisdiction: GLOBAL
      version: "2023-01-01"
      effective_from: "2023-01-01"
      reference: BCBS Basel Framework, RBC standard
      source_url: https://www.bis.org/committees/bcbs/basel-framework/RBC/standard.pdf
      data_residency: GLOBAL
  - file: basel-lex.pdf
    url: https://www.bis.org/committees/bcbs/basel-framework/LEX/standard.pdf
    para_rules:
      - {pattern: '^(\d{2}\.\d{1,3})\s', prefix: "LEX"}
    meta:
      doc_id: basel-lex
      title: Basel Framework LEX - Large exposures
      framework: BASEL_III
      jurisdiction: GLOBAL
      version: "2023-01-01"
      effective_from: "2023-01-01"
